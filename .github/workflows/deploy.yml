name: Deploy

on:
  # Manual: Actions → Deploy → Run workflow
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [status, deploy, rollback]
        default: status
      project:
        description: "Project name from projects/*.conf, or 'all' (deploy/status only)"
        type: string
        default: all
      ref:
        description: "Git ref to deploy / SHA to roll back to (optional)"
        type: string
        required: false
      force:
        description: "Discard uncommitted changes in the server checkout (FORCE=1)"
        type: boolean
        default: false

  # Automatic: an app repo calls the GitHub API after merging to main, e.g.
  #   gh api repos/Tswalano/deployment-repo/dispatches \
  #     -f event_type=deploy -f client_payload[project]=liftparcel -f client_payload[ref]=main
  repository_dispatch:
    types: [deploy]

# Never run two pipeline jobs against the same server at once
concurrency:
  group: ec2-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write      # OIDC → AWS (no long-lived AWS keys in GitHub)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in repo Settings → Environments if wanted
    timeout-minutes: 30
    env:
      ACTION:  ${{ github.event.inputs.action  || 'deploy' }}
      PROJECT: ${{ github.event.inputs.project || github.event.client_payload.project }}
      REF:     ${{ github.event.inputs.ref     || github.event.client_payload.ref }}
      FORCE:   ${{ github.event.inputs.force == 'true' && '1' || '' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ec2-user' }}
      # EC2 Instance Connect: deploy.sh pushes a throwaway key (valid 60s) via the OIDC role — no PEM
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_REGION: af-south-1
      # shown on the ops dashboard
      DEPLOY_ACTOR: ${{ github.actor }}
      DEPLOY_TRIGGER: ${{ github.event_name }}
      DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          [[ -n "$PROJECT" ]] || { echo "::error::project is required"; exit 1; }
          if [[ "$PROJECT" != all && ! -f "projects/$PROJECT.conf" ]]; then
            echo "::error::unknown project '$PROJECT'"; ls projects; exit 1
          fi
          [[ "$PROJECT" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::bad project name"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad ref"; exit 1; }

      # Port 22 is restricted in the security group, so open it for THIS runner's IP only
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Allow SSH from this runner
        env:
          SG_ID: ${{ vars.DEPLOY_SG_ID }}
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-run-${{ github.run_id }}}]"
          sleep 5

      - name: Run pipeline
        run: |
          chmod +x deploy.sh server/pipeline.sh
          args=("$ACTION" "$PROJECT")
          [[ -n "$REF" ]] && args+=("$REF")
          ./deploy.sh "${args[@]}"

      - name: Final status
        if: always() && env.ACTION != 'status'
        run: ./deploy.sh status all

      - name: Revoke runner SSH access
        if: always() && env.RUNNER_IP != ''
        env:
          SG_ID: ${{ vars.DEPLOY_SG_ID }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]"
