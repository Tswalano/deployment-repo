# Installed by server/install-ops-console.sh expose <domain>
# Public entry to the Ops Console (127.0.0.1:9200). The console does its own sign-in (users, roles,
# read-only demo), so there is no basic auth here. The old ops dashboard stays on 127.0.0.1:9100,
# localhost-only, as the per-instance status agent the console reads through SSM.
limit_req_zone $binary_remote_addr zone=opsconsole_auth:1m rate=10r/m;

server {
    listen 80;
    server_name __OPS_DOMAIN__;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 64k;

    location / {
        proxy_pass         http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;   # overwrite, never append: the console trusts the first entry
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;                            # SSM round trips (logs, refresh) can take a while
    }

    # Coarse outer limit on sign-in; the console also rate-limits and locks accounts itself.
    location /api/auth/ {
        limit_req          zone=opsconsole_auth burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
