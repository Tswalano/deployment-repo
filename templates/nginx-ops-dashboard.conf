# Installed by server/install-ops-dashboard.sh expose <domain>
# Basic auth (password in SSM /apps/ops-dashboard-auth/PASSWORD) in front of the localhost-only dashboard.
server {
    listen 80;
    server_name __OPS_DOMAIN__;

    auth_basic           "ops";
    auth_basic_user_file /etc/nginx/ops-dashboard.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass       http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
