# LiftParcel API (parcel delivery) — Node/TypeScript, Drizzle ORM
# Repo: github.com/Tswalano/svelte-delivery-app (api/ folder), pulled via the
# server's `liftparcel` SSH host alias (repo deploy key).
SERVICE="liftparcel"
SOURCE_DIR="/opt/apps/liftparcel"
BRANCH="main"
APP_SUBDIR="api"
INSTALL_CMD="npm ci --no-audit --no-fund"
BUILD_CMD=""                 # unit currently runs `npm run dev` (ts-node) — no compile step
MIGRATE_CMD="npm run db:migrate"   # drizzle-kit migrate; DB baselined 2026-11-10 (0000–0002 recorded as applied)
DB_NAME="liftparcel"
HEALTH_URL="http://127.0.0.1:4000/health"
HEALTH_TIMEOUT=120           # ts-node cold start on a t3.micro is slow
DOMAIN="liftapi.glenify.studio"
