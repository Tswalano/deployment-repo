# =============================================================================
# Project definition — copy to projects/<name>.conf (files starting with "_"
# are ignored). Sourced by bash, so use KEY="value" with no spaces around "=".
# =============================================================================

# --- required ---------------------------------------------------------------
SERVICE="myapp"                        # systemd unit name (without .service)
SOURCE_DIR="/opt/apps/myapp"           # git clone on the server (server's own deploy key pulls it)
HEALTH_URL="http://127.0.0.1:5000/health"   # must return HTTP 2xx when the app is up

# --- optional ---------------------------------------------------------------
BRANCH="main"                          # default ref to deploy
APP_SUBDIR="api"                       # folder inside the repo holding package.json ("." = repo root)
# RUN_DIR="/home/ec2-user/myapp"       # only if the app runs from a different folder than
#                                      # SOURCE_DIR/APP_SUBDIR → enables "sync mode" (rsync + snapshots)
INSTALL_CMD="npm ci --no-audit --no-fund"
BUILD_CMD="npm run build"              # empty = no build step
MIGRATE_CMD=""                         # e.g. "npx drizzle-kit migrate" / "npx prisma migrate deploy"
DB_NAME="myapp"                        # Postgres DB to pg_dump before each deploy (empty = none)
DB_USER="postgres"                     # role used for pg_dump (password from ~/.pgpass)
HEALTH_TIMEOUT=90                      # seconds to wait for HEALTH_URL after restart
DOMAIN="myapi.glenify.studio"          # informational, shown by `status`
