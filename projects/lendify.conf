# Lendify API (multi-tenant loan management) — Hono on Node, Prisma ORM
# Repo: github.com/Tswalano/MoneyLook (backend/ folder), cloned at /opt/apps/app2.
# The running copy lives in ~/lendify (not a git checkout), so this project uses
# SYNC MODE: pull in SOURCE_DIR → rsync backend/ into RUN_DIR → build → restart.
SERVICE="lendify"
SOURCE_DIR="/opt/apps/app2"
BRANCH="main"
APP_SUBDIR="backend"
RUN_DIR="/home/ec2-user/lendify"
INSTALL_CMD="npm ci --no-audit --no-fund"
BUILD_CMD="npx prisma generate && npm run build"
MIGRATE_CMD=""               # enable with: "npx prisma migrate deploy" once reviewed
DB_NAME="lendify"
DB_USER="postgres"
HEALTH_URL="http://127.0.0.1:8088/health"
DOMAIN="lendifyapi.glenify.studio"
