<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ops Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5f6b7a; --line: #e3e7ec;
    --ok: #12805c; --ok-bg: #e5f5ee; --warn: #a15c00; --warn-bg: #fff3df; --bad: #b42318; --bad-bg: #fde8e7;
    --bar: #2f6fdf; --bar-bg: #e7edf8; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ecf1; --muted: #93a0b0; --line: #262c35;
      --ok: #4cc38a; --ok-bg: #11291f; --warn: #f0b252; --warn-bg: #2d2412; --bad: #ff7b72; --bad-bg: #331817;
      --bar: #6ea2ff; --bar-bg: #1d2533;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --ink: #e8ecf1; --muted: #93a0b0; --line: #262c35;
    --ok: #4cc38a; --ok-bg: #11291f; --warn: #f0b252; --warn-bg: #2d2412; --bad: #ff7b72; --bad-bg: #331817;
    --bar: #6ea2ff; --bar-bg: #1d2533;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between;
           padding: 18px 16px 6px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 32px; display: grid; gap: 14px; }
  .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .stat { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0 4px; }
  .stat b { font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--bar-bg); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--bar); border-radius: 99px; transition: width .4s; }
  .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ok { color: var(--ok); background: var(--ok-bg); } .warn { color: var(--warn); background: var(--warn-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .app-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .app-head h3 { margin: 0; font-size: 16px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin-top: 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--bar); text-decoration: none; } a:hover { text-decoration: underline; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .deploys { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .deploys li { display: flex; gap: 8px; padding: 2px 0; color: var(--muted); }
  .err { color: var(--bad); }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1 id="title">Ops Dashboard</h1>
  <div class="meta"><span id="updated">loading…</span> · <button id="refresh" type="button">Refresh</button></div>
</header>
<main>
  <section class="grid" id="host"></section>
  <section>
    <h2>Applications</h2>
    <div class="grid" id="apps"></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>Database</h2><div id="db"></div></div>
    <div class="panel"><h2>System services</h2><div id="services"></div>
      <h2 style="margin-top:16px">TLS certificates</h2><div id="certs"></div></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : String(k));
    return n;
  };
  const bytes = (b) => {
    if (b == null) return "—";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (b >= 100 || i === 0 ? b.toFixed(0) : b.toFixed(1)) + " " + u[i];
  };
  const dur = (s) => {
    if (s == null) return "—";
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  };
  const ago = (iso) => {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  };
  const pill = (cls, text) => el("span", { class: "pill " + cls }, text);
  const meter = (label, used, total, extra) => {
    const pct = total ? Math.round(used / total * 100) : 0;
    const level = pct >= 90 ? " bad" : pct >= 75 ? " warn" : "";
    return el("div", {},
      el("div", { class: "stat" }, el("span", {}, label), el("b", {}, `${bytes(used)} / ${bytes(total)} · ${pct}%`)),
      el("div", { class: "bar" + level, role: "meter", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100, "aria-label": label },
        el("i", { style: `width:${pct}%` })),
      extra ? el("div", { class: "meta", style: "margin-top:4px" }, extra) : null);
  };
  const unitPill = (u) => u.active === "active" ? pill("ok", u.sub || "active")
    : u.active === "activating" || u.active === "reloading" ? pill("warn", u.active) : pill("bad", u.active || "unknown");

  function renderHost(h, at) {
    $("title").textContent = `Ops Dashboard — ${h.hostname.split(".")[0]}`;
    const box = $("host"); box.replaceChildren(
      el("div", { class: "panel" }, el("h2", {}, "Memory"),
        meter("RAM", h.memory.used, h.memory.total, `${bytes(h.memory.available)} available`),
        el("div", { style: "height:10px" }),
        meter("Swap", h.swap.used, h.swap.total)),
      el("div", { class: "panel" }, el("h2", {}, "Disk  /"),
        meter("Root volume", h.disk.used, h.disk.total, `${bytes(h.disk.free)} free`)),
      el("div", { class: "panel" }, el("h2", {}, "Host"),
        el("dl", { class: "kv" },
          el("dt", {}, "Uptime"), el("dd", {}, `${dur(h.uptime_seconds)} (booted ${new Date(h.booted_at).toLocaleString()})`),
          el("dt", {}, "Load 1/5/15"), el("dd", { class: "mono" }, h.load.join(" · ") + ` on ${h.cpus} vCPU`),
          el("dt", {}, "Schedule"), el("dd", {}, "Up 04:00–16:00 UTC (EventBridge)"))));
  }

  function renderApps(list) {
    $("apps").replaceChildren(...list.map((p) => {
      const healthy = p.health && p.health.code >= 200 && p.health.code < 300;
      const status = p.unit.active !== "active" ? pill("bad", "down")
        : healthy ? pill("ok", `healthy · ${p.health.ms} ms`) : pill("bad", `health ${p.health ? p.health.code ?? "timeout" : "n/a"}`);
      const g = p.git || {};
      const w = p.warnings_24h || { count: 0 };
      return el("article", { class: "panel" },
        el("div", { class: "app-head" }, el("h3", {}, p.project), status),
        el("dl", { class: "kv" },
          el("dt", {}, "URL"), el("dd", {}, p.domain ? el("a", { href: `https://${p.domain}`, target: "_blank", rel: "noopener" }, p.domain) : "—"),
          el("dt", {}, "Service"), el("dd", {}, el("code", {}, p.service), " ", unitPill(p.unit)),
          el("dt", {}, "Uptime"), el("dd", {}, `${dur(p.unit.uptime_seconds)} · ${p.unit.restarts ?? 0} restarts`),
          el("dt", {}, "Memory"), el("dd", {}, bytes(p.unit.memory)),
          el("dt", {}, "Version"), el("dd", {}, g.sha ? [el("code", {}, g.sha), ` ${g.branch} · `, g.subject || ""] : "—"),
          el("dt", {}, "Database"), el("dd", {}, p.db ? [el("code", {}, p.db), p.migrations ? " · migrations on" : ""] : "—"),
          el("dt", {}, "Warnings 24h"), el("dd", {}, w.count ? [pill("warn", String(w.count)), " ", el("span", { class: "mono", title: w.last }, (w.last || "").slice(0, 70))] : pill("ok", "0"))),
        p.deploys.length ? el("ul", { class: "deploys", "aria-label": "Recent deploys" },
          p.deploys.slice(0, 3).map((d) => el("li", {},
            pill(d.status === "ok" ? "ok" : "bad", d.action), el("code", {}, d.sha), el("span", {}, d.ref), el("span", {}, ago(d.at))))) : null);
    }));
  }

  function renderDb(db) {
    const box = $("db");
    if (!db.ok) { box.replaceChildren(el("p", { class: "err" }, db.error)); return; }
    const conns = Object.entries(db.connections_by_state).map(([k, v]) => `${v} ${k}`).join(" · ");
    box.replaceChildren(
      el("dl", { class: "kv", style: "margin-top:0" },
        el("dt", {}, "Engine"), el("dd", {}, db.version),
        el("dt", {}, "Running since"), el("dd", {}, new Date(db.started_at).toLocaleString()),
        el("dt", {}, "Connections"), el("dd", {}, `${conns} (max ${db.max_connections})`),
        el("dt", {}, "Shared buffers"), el("dd", {}, db.shared_buffers)),
      el("div", { class: "table-wrap", style: "margin-top:10px" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Database"), el("th", { class: "num" }, "Size"), el("th", { class: "num" }, "Tables"),
          el("th", { class: "num" }, "≈ Rows"), el("th", { class: "num" }, "Conns"), el("th", {}, "Largest tables"))),
        el("tbody", {}, db.databases.map((d) => el("tr", {},
          el("td", {}, el("code", {}, d.name)), el("td", { class: "num" }, bytes(d.size)),
          el("td", { class: "num" }, d.tables ?? "—"), el("td", { class: "num" }, d.est_rows ?? "—"),
          el("td", { class: "num" }, d.connections),
          el("td", { class: "meta" }, (d.largest || []).map((t) => `${t.table} (${t.rows})`).join(", ") || "—")))))));
  }

  function renderServices(list) {
    $("services").replaceChildren(el("table", {}, el("tbody", {}, list.map((u) => el("tr", {},
      el("td", {}, el("code", {}, u.unit)), el("td", {}, unitPill(u)),
      el("td", { class: "num meta" }, u.memory ? bytes(u.memory) : ""))))));
  }

  function renderCerts(list) {
    $("certs").replaceChildren(el("table", {}, el("tbody", {}, list.map((c) => el("tr", {},
      el("td", {}, c.domain),
      el("td", { class: "num" }, c.error ? pill("bad", c.error)
        : pill(c.days_left < 14 ? "bad" : c.days_left < 30 ? "warn" : "ok", `${c.days_left} days`)))))));
  }

  let timer;
  async function load() {
    clearTimeout(timer);
    try {
      const r = await fetch("api/status", { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const s = await r.json();
      renderHost(s.host); renderApps(s.projects); renderDb(s.database); renderServices(s.services); renderCerts(s.certificates);
      $("updated").textContent = `Updated ${new Date(s.generated_at).toLocaleTimeString()} · collected in ${s.collect_ms} ms`;
    } catch (e) {
      $("updated").replaceChildren(el("span", { class: "err" }, `Update failed: ${e.message}`));
    }
    timer = setTimeout(load, 10000);
  }
  $("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
